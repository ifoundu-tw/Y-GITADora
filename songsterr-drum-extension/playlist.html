<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鼓遊戲播放清單</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0d1016;color:#eee;font:15px system-ui;overflow:hidden}button,input,select{font:inherit;border-radius:7px}button{border:0;background:#3478ff;color:#fff;cursor:pointer}button:hover{filter:brightness(1.14)}#layout{display:grid;grid-template-columns:340px minmax(0,1fr);height:100vh}aside{padding:22px;background:#171b23;border-right:1px solid #343a47;overflow-y:auto}main{min-width:0;padding:22px 26px;background:radial-gradient(circle at 70% 20%,#202c42,#0d1016 65%);display:flex;flex-direction:column}h1{margin:0 0 18px;font-size:24px}h2{margin:0;font-size:27px}.panel{padding:14px;background:#202630;border:1px solid #343c4b;border-radius:11px}.label{display:block;color:#aeb9cb;font-size:13px;margin:3px 0}.field{width:100%;padding:11px;margin:5px 0;background:#252a34;color:#fff;border:1px solid #4a5160}.primary{width:100%;padding:11px;margin-top:7px}.backup{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.backup button{padding:10px;background:#48546a}#status{min-height:48px;color:#ffca6a;margin-top:12px;line-height:1.4}.hint{color:#8792a5;line-height:1.65;font-size:13px}.main-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px}.count{color:#92a0b7}.filters{display:grid;grid-template-columns:minmax(210px,2fr) repeat(5,minmax(95px,1fr));gap:8px;padding:12px;background:#171c25;border:1px solid #303847;border-radius:11px;margin-bottom:14px}.filters .field{margin:0;min-width:0}.songs{min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-content:start;gap:12px;padding:2px 8px 28px 2px;scrollbar-gutter:stable}.songs::-webkit-scrollbar{width:12px}.songs::-webkit-scrollbar-track{background:#10141c;border-radius:8px}.songs::-webkit-scrollbar-thumb{background:#59667d;border:2px solid #10141c;border-radius:8px}.song{position:relative;min-height:116px;padding:16px 82px 14px 16px;background:linear-gradient(135deg,#252c38,#1d222c);border:1px solid #343e50;border-radius:11px;cursor:pointer;transition:.15s}.song:hover{transform:translateY(-2px);border-color:#4f86d7;background:linear-gradient(135deg,#2d3d55,#222b38)}.song h3{margin:0 0 5px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song small{display:block;color:#9faabd}.stats{display:flex;gap:8px;margin-top:13px}.badge{padding:5px 8px;background:#111722;border:1px solid #394458;border-radius:6px;color:#c7d7ef;font-weight:650}.song-actions{position:absolute;right:10px;top:10px;display:flex;gap:6px}.icon{width:31px;height:31px;padding:0;background:#3a4558;font-size:17px}.favorite.active{background:#bc8424;color:#fff2a6}.delete{background:#8d3541}.empty{grid-column:1/-1;text-align:center;color:#8992a3;padding:70px 20px}@media(max-width:1000px){#layout{grid-template-columns:290px 1fr}.filters{grid-template-columns:1fr 1fr 1fr}.filters #title{grid-column:1/-1}}@media(max-width:700px){body{overflow:auto}#layout{display:block;height:auto}aside{border:0}main{min-height:70vh}.filters{grid-template-columns:1fr 1fr}.filters #title{grid-column:1/-1}.songs{overflow:visible;grid-template-columns:1fr}}
</style><div id="layout"><aside><h1>加入歌曲 <small id="version" style="font-size:12px;color:#8490a5"></small></h1><div class="panel"><label class="label" for="url">Songsterr 鼓譜網址</label><input class="field" id="url" placeholder="貼上 Songsterr 網址"><button class="primary" id="add">分析鼓譜並加入</button></div><div class="backup"><button id="export">匯出備份</button><button id="import">匯入備份</button></div><input id="import-file" type="file" accept="application/json,.json" hidden><div id="status"></div><p class="hint">加入時會自動選擇鼓軌，並記錄原始 BPM 與音符總數。舊歌單缺少的資料也會自動補齊。</p></aside><main><div class="main-head"><h2>播放清單</h2><span class="count" id="count"></span></div><div class="filters"><input class="field" id="title" placeholder="搜尋播放清單歌名／演出者"><select class="field" id="favorite-filter"><option value="all">全部歌曲</option><option value="favorite">★ 我的最愛</option></select><select class="field" id="sort"><option value="added">最近加入</option><option value="name">名稱 A–Z</option><option value="bpm-asc">BPM 低→高</option><option value="bpm-desc">BPM 高→低</option><option value="notes-asc">音符少→多</option><option value="notes-desc">音符多→少</option></select><input class="field" id="bpm-min" type="number" min="0" placeholder="BPM 最低"><input class="field" id="bpm-max" type="number" min="0" placeholder="BPM 最高"><input class="field" id="notes-min" type="number" min="0" placeholder="音符至少"></div><div id="songs" class="songs"></div></main></div><script src="playlist.js"></script></html>
